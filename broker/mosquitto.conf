# ==============================================================================
# SMART HOME IoT 2026 — MOSQUITTO MQTT BROKER CONFIGURATION (LAB 2)
# Hỗ trợ:
#   - 1883: MQTT TCP (nội bộ / test LAN)
#   - 8883: MQTT over TLS (bảo mật cho ESP32 & Backend)
#   - 9001: MQTT over WebSocket (cho Web / Mobile client)
# ==============================================================================

persistence true
persistence_location /mosquitto/data/
log_dest file /mosquitto/log/mosquitto.log
log_dest stdout
log_type error
log_type warning
log_type notice
log_type information

# Bắt buộc xác thực Username/Password và áp dụng phân quyền Topic (ACL)
allow_anonymous false
password_file /mosquitto/config/passwd
acl_file /mosquitto/config/acl.conf

# 1. Cổng MQTT TCP nội bộ (1883)
listener 1883 0.0.0.0
protocol mqtt

# 2. Cổng MQTT over TLS (8883) — cần đặt chứng chỉ vào thư mục broker/certs/
# Bỏ comment 5 dòng dưới khi đã sinh ca.crt, server.crt, server.key
# listener 8883 0.0.0.0
# protocol mqtt
# cafile /mosquitto/certs/ca.crt
# certfile /mosquitto/certs/server.crt
# keyfile /mosquitto/certs/server.key

# 3. Cổng MQTT over WebSocket (9001) cho Mobile/Web
listener 9001 0.0.0.0
protocol websockets
